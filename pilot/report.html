<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>콘텐츠 조사 · 수집 검증</title>
<style>body{margin:0;background:#f4f6fa;color:#182437;font:15px/1.6 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:40px 24px}h1{font-size:30px;margin:8px 0}small,.muted{color:#58677b}.notice{padding:18px;background:#fff4d9;border-radius:12px}section{background:white;border:1px solid #dce2ec;border-radius:14px;padding:22px;margin:22px 0}.stats{display:flex;gap:20px;flex-wrap:wrap}.stat{background:#f1f5fb;padding:14px;border-radius:9px}select{padding:10px;margin:15px 8px 15px 0}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:12px;text-align:left;border-bottom:1px solid #e6eaf1;vertical-align:top}th{background:#f5f7fb}a{color:#2548a4}.scroll{overflow:auto}.badge{white-space:nowrap;font-weight:650}.error{color:#a33324}footer{margin:20px 0;color:#58677b}</style>
<main><small>CONTENT RESEARCH / 수집 시험</small><h1>영상 성과의 근거를 확인하세요</h1><p id="meta"></p><div class="notice">첫 수집 시험입니다. 댓글·자막·AI 분석은 아직 실행하지 않습니다. 3분 이하 영상은 쇼츠로 단정하지 않습니다. 형식 미확인이나 목록 누락이 있으면 평균과 성과 판정을 보류합니다.</div><label>성과 필터 <select id="filter"><option value="all">전체 영상</option><option>고성과</option><option>저성과</option><option>보류</option><option value="selected">선정된 상·하위 영상</option></select></label><div id="channels"></div><footer>평균: 최근 3개월, 채널·형식별 전체 적격 영상(자기 자신 포함). 긴 영상 7일·쇼츠 3일 미만 제외. 3배 이상 고성과 / 0.5배 이하 저성과.</footer></main>
<script>const data=/*REPORT_DATA*/null;
const el=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e};
const fmt=n=>n===null||n===undefined?'—':Number(n).toLocaleString('ko-KR',{maximumFractionDigits:2});
function draw(){document.querySelector('#channels').replaceChildren();if(!data){document.querySelector('#meta').textContent='수집 결과가 아직 없습니다. 생성된 report.html을 열어주세요.';return}document.querySelector('#meta').textContent=`수집 시점 ${data.collected_at} · 시작 경계 ${data.cutoff} · API 요청 ${data.requests}회`;
for(const c of data.channels){const section=el('section','');section.append(el('h2',c.title||c.handle),el('p',`${c.handle} · 기간 내 ${c.videos.length}개 · 목록 ${c.complete?'확인 완료':'미완료'}`));for(const issue of c.issues){let p=el('p',issue);p.className='error';section.append(p)}const stats=el('div','');stats.className='stats';for(const g of c.groups){const s=el('div',`${g.kind==='long'?'긴 영상':'쇼츠'} · 평균 ${fmt(g.average)}회 · ${g.count}개 ${g.count<10?'(표본 부족)':''} · ${g.status}`);s.className='stat';stats.append(s)}section.append(stats);let table=el('table','');let head=el('tr','');for(const name of ['영상 / 원본','게시일','형식 / 근거','조회수','평균 대비','판정'])head.append(el('th',name));table.append(head);const filter=document.querySelector('#filter').value;
for(const v of [...c.videos].sort((a,b)=>(b.views||0)-(a.views||0))){if(filter!=='all'&&(filter==='selected'?!v.selected:v.label!==filter))continue;const row=el('tr','');const title=el('td','');const a=el('a',v.title);if(/^https:\/\/www\.youtube\.com\/watch\?v=[\w-]+$/.test(v.url))a.href=v.url;a.target='_blank';a.rel='noopener noreferrer';title.append(a);row.append(title,el('td',v.published.slice(0,10)),el('td',`${{long:'긴 영상',short:'쇼츠',live:'라이브(제외)',unknown:'미확인'}[v.kind]} / ${v.format_evidence}`),el('td',fmt(v.views)),el('td',v.ratio===null?'—':fmt(v.ratio)+'배'),el('td',v.label+(v.sample>0&&v.sample<10?' · 표본 부족':'')));table.append(row)}let wrap=el('div','');wrap.className='scroll';wrap.append(table);section.append(wrap);document.querySelector('#channels').append(section)}}document.querySelector('#filter').addEventListener('change',draw);draw();</script></html>
